[build]
  command = "npm run build"
  publish = "dist/stream/browser"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://pagead2.googlesyndication.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://image.tmdb.org data:; frame-src https://cinesrc.st; connect-src 'self' wss://0.peerjs.com https://0.peerjs.com"

[[redirects]]
  from = "/api/tmdb"
  to = "/.netlify/functions/tmdb-proxy"
  status = 200
